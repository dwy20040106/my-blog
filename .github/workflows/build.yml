
name: Build VitePress and Update dist

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# 防止多个构建同时运行
concurrency:
  group: vitepress-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取 main 源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # 2. 配置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 配置 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      # 4. 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 构建 VitePress
      - name: Build VitePress
        run: pnpm run docs:build

      # 6. 验证构建产物
      - name: Verify dist
        run: |
          set -e

          DIST="docs/.vitepress/dist"

          if [ ! -s "$DIST/index.html" ]; then
            echo "ERROR: index.html missing or empty"
            exit 1
          fi

          echo "Total files:"
          find "$DIST" -type f | wc -l

          echo "HTML files:"
          find "$DIST" -type f -iname "*.html" | wc -l

          echo "Image files:"
          find "$DIST" -type f \
            \( -iname "*.png" -o -iname "*.jpg" \
            -o -iname "*.jpeg" -o -iname "*.gif" \
            -o -iname "*.webp" -o -iname "*.svg" \
            -o -iname "*.ico" \) | wc -l

          echo "All build files:"
          du -sh "$DIST"

      # 7. 备份完整构建产物到临时目录
      - name: Backup complete dist
        run: |
          set -e

          mkdir -p /tmp/vitepress-dist

          cp -a docs/.vitepress/dist/. /tmp/vitepress-dist/

          touch /tmp/vitepress-dist/.nojekyll

          echo "Backup completed."
          find /tmp/vitepress-dist -type f | wc -l

      # 8. 更新 main 分支中的 dist
      - name: Update dist in main
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 检查备份文件
          test -s /tmp/vitepress-dist/index.html

          # 删除旧 dist 的 Git 索引记录，但保留工作区文件
          git rm -r -f --cached --ignore-unmatch docs/.vitepress/dist

          # 将完整构建产物恢复到原目录
          mkdir -p docs/.vitepress/dist

          cp -a /tmp/vitepress-dist/. docs/.vitepress/dist/

          # 强制添加所有新文件，包括图片、HTML、字体等
          git add -f docs/.vitepress/dist

          # 显示提交文件数量
          echo "Files to commit:"
          git diff --cached --numstat | wc -l

          echo "New image files:"
          find docs/.vitepress/dist -type f \
            \( -iname "*.png" -o -iname "*.jpg" \
            -o -iname "*.jpeg" -o -iname "*.gif" \
            -o -iname "*.webp" -o -iname "*.svg" \
            -o -iname "*.ico" \) | wc -l

          # 如果没有变化则不提交
          if git diff --cached --quiet; then
            echo "No changes in dist."
            exit 0
          fi

          # 提交最新构建产物
          git commit -m "chore: update VitePress dist [skip ci]"

          # 推送 main
          git push origin HEAD:main
