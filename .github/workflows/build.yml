
name: Build VitePress and Update dist

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# 防止多个构建同时提交
concurrency:
  group: vitepress-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取 main 分支
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # 2. 配置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 配置 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      # 4. 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 构建 VitePress
      - name: Build VitePress
        run: pnpm run docs:build

      # 6. 检查构建产物
      - name: Verify dist
        run: |
          if [ ! -f docs/.vitepress/dist/index.html ]; then
            echo "Build failed: index.html not found"
            exit 1
          fi

          if [ ! -s docs/.vitepress/dist/index.html ]; then
            echo "Build failed: index.html is empty"
            exit 1
          fi

          echo "Build successful!"
          du -sh docs/.vitepress/dist

      # 7. 删除旧 dist，保留最新构建产物
      - name: Update dist in main
        run: |
          # 配置 Git 用户
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 添加 GitHub Pages 兼容文件
          touch docs/.vitepress/dist/.nojekyll

          # 删除 Git 跟踪的旧 dist
          git rm -rf docs/.vitepress/dist

          # 重新添加刚刚构建好的 dist
          git add -f docs/.vitepress/dist

          # 如果没有变化，则不提交
          if git diff --cached --quiet; then
            echo "No dist changes to commit."
            exit 0
          fi

          # 提交构建产物
          git commit -m "chore: update VitePress dist [skip ci]"

          # 推送到 main
          git push origin HEAD:main
