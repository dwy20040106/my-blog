
name: Build VitePress and Publish dist

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 允许 GitHub Actions 推送 deploy-dist 分支
permissions:
  contents: write

# 防止多个构建同时发布
concurrency:
  group: vitepress-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取 main 分支源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # 2. 配置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 配置 pnpm 12.18.0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      # 4. 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 构建 VitePress
      - name: Build VitePress
        run: pnpm run docs:build

      # 6. 检查构建产物
      - name: Verify dist
        run: |
          if [ ! -f docs/.vitepress/dist/index.html ]; then
            echo "Build failed: index.html not found"
            exit 1
          fi

          if [ ! -s docs/.vitepress/dist/index.html ]; then
            echo "Build failed: index.html is empty"
            exit 1
          fi

          echo "Build successful!"
          echo "Build output size:"
          du -sh docs/.vitepress/dist

      # 7. 暂存构建产物
      - name: Prepare deploy files
        run: |
          mkdir -p /tmp/deploy-dist
          cp -a docs/.vitepress/dist/. /tmp/deploy-dist/
          touch /tmp/deploy-dist/.nojekyll

      # 8. 发布到 deploy-dist 分支
      - name: Publish dist branch
        run: |
          # 配置 Git 用户
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 清除构建产生的工作区修改
          git reset --hard HEAD
          git clean -fdx

          # 创建独立的 deploy-dist 分支
          git switch --orphan deploy-dist

          # 清空当前分支文件
          git rm -rf . || true
          git clean -fdx

          # 复制构建产物
          cp -a /tmp/deploy-dist/. .

          # 提交构建产物
          git add -A
          git commit -m "Deploy dist from ${GITHUB_SHA}"

          # 强制更新远程 deploy-dist 分支
          git push origin deploy-dist --force
