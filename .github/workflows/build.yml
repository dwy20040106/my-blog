name: Build VitePress and Publish dist

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vitepress-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取 main 源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      # 2. 安装 Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 构建 VitePress
      - name: Build VitePress
        run: npm run docs:build

      # 5. 验证构建结果
      - name: Verify dist
        run: |
          test -f docs/.vitepress/dist/index.html
          test -d docs/.vitepress/dist
          echo "Build success"
          du -sh docs/.vitepress/dist

      # 6. 备份构建产物到临时目录
      - name: Prepare deploy files
        run: |
          mkdir -p /tmp/deploy-dist
          cp -a docs/.vitepress/dist/. /tmp/deploy-dist/

      # 7. 创建 deploy-dist 分支并发布
      - name: Publish dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan deploy-dist
          git rm -rf . || true
          git clean -fdx

          cp -a /tmp/deploy-dist/. .

          touch .nojekyll

          git add -A
          git commit -m "Deploy dist from ${GITHUB_SHA}"
          git push origin deploy-dist --force
